<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RouteWatch &middot; Find a flight</title>
<meta name="theme-color" content="#0a0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RouteWatch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/rw.css?v=3">
<style>
  .fbar{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;padding:14px;margin-bottom:14px}
  .fbar .swap{display:none}
  .fsum{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:0 2px 12px;flex-wrap:wrap}
  .fsum #summary{color:var(--dim);font-size:13.5px}
  .fsum #summary b{color:var(--text)}
  .flayout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
  aside.fside{position:sticky;top:calc(var(--hdr) + 14px);max-height:calc(100vh - var(--hdr) - 28px);overflow-y:auto;padding:16px}
  aside.fside fieldset{border:0;padding:0;margin:0 0 18px}
  aside.fside legend{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin-bottom:6px;padding:0;font-weight:600}
  label.opt{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:13.5px;
    -webkit-tap-highlight-color:transparent}
  label.opt:hover{background:var(--s2)}
  label.opt.zero{opacity:.4}
  label.opt .count{margin-left:auto;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
  label.opt .hint,.hint{color:var(--faint);font-size:12px}
  input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;flex:none;margin:0}
  .sheet-head{display:none}
  .sheet-foot{display:flex;gap:8px;margin-top:6px}
  .sheet-foot .btn{flex:1}
  #sheetGo{display:none}
  .bucket-group{margin-bottom:22px}
  .bucket-group>.panel{overflow-x:auto}
  .bucket-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px}
  .bucket-head h2{font-size:15px;margin:0;letter-spacing:-.2px}
  .bucket-head .n{margin-left:auto;color:var(--faint);font-size:12px}
  .dest .dcode{font-weight:700;font-family:var(--mono);font-size:13.5px;letter-spacing:.3px}
  .dest small{display:block;font-weight:400;color:var(--dim);font-size:12px}
  .dblock{float:right;font-weight:700;font-variant-numeric:tabular-nums}
  .ops{color:var(--dim);font-size:12.5px}
  .toggle{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:12px;padding:0;margin-top:4px;font-weight:600}
  tr.open td{background:rgba(92,171,255,.04)}
  tr.detailrow>td{background:var(--s2);padding:4px 12px 14px}
  .detail-grid{display:flex;flex-wrap:wrap;gap:18px;padding:10px 2px 2px}
  .detail-block{min-width:170px}
  .detail-block.wide{flex:1 1 420px;min-width:0}
  .detail-block h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin:0 0 6px;font-weight:650}
  .fchips{display:flex;flex-wrap:wrap;gap:5px}
  .fchip{font-size:11.5px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--s1);font-variant-numeric:tabular-nums}
  .hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.flights{border-collapse:collapse;font-size:12.5px;min-width:440px}
  table.flights th{text-align:left;color:var(--faint);font-weight:500;padding:2px 12px 4px 0;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  table.flights td{padding:5px 12px 5px 0;border-top:1px solid var(--line-soft);white-space:nowrap}
  .disclaimer{color:var(--faint);font-size:12px;margin-top:18px;max-width:900px}
  @media (max-width:980px){.flayout{grid-template-columns:minmax(0,1fr)}}
  @media (max-width:980px){
    aside.fside{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:62;max-height:82vh;border-radius:20px 20px 0 0;
      transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(16px + var(--safe-b));
      border-bottom:0}
    body.fopen aside.fside{transform:none}
    .fsheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:61;opacity:0;pointer-events:none;transition:opacity .2s}
    body.fopen .fsheet-bg{opacity:1;pointer-events:auto}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
    .sheet-head b{font-size:16px}
    #sheetGo{display:inline-flex}
    .sheet-foot{position:sticky;bottom:0;background:var(--s1);padding-top:10px;z-index:3}
  }
  @media (min-width:981px){#filtersBtn{display:none}.fsheet-bg{display:none}}
  @media (max-width:760px){
    .fbar{grid-template-columns:1fr;gap:10px;padding:12px}
    .rt td.dest .toggle{display:inline-block;margin-top:6px}
    .rt td[data-l="Block"]{display:none}
    tr.detailrow>td{padding:0 14px 14px}
    tr.detailrow{padding:0!important}
    .detail-block{min-width:0;flex:1 1 100%}
  }
  @media (min-width:761px){.dblock{display:none}}
</style>
</head>
<body data-page="find">
<script src="assets/rw-shell.js?v=3"></script>
<main class="rw-main">
  <div class="page-title"><div><h1>Find a flight</h1><p class="dk-only">Pick a departure and what you want to fly. Every destination is an airport in your network.</p></div></div>
  <div class="panel fbar">
    <label class="field"><span>From</span><select id="from"></select></label>
    <label class="field"><span>To <em class="faint" style="font-style:normal;text-transform:none;letter-spacing:0">(empty = surprise me)</em></span>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg><input type="search" id="toFilter" placeholder="ICAO or city" autocomplete="off"></div></label>
  </div>

  <div class="fsum">
    <div id="summary">&nbsp;</div>
    <button class="btn" id="filtersBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters <span class="badge" id="fcount" hidden></span></button>
  </div>

  <div class="flayout">
    <aside class="panel fside" id="fside" aria-label="Filters">
      <div class="sheet-head"><b>Filters</b><button class="btn ghost iconbtn" id="sheetClose" aria-label="Close">&times;</button></div>
      <fieldset><legend>Aircraft</legend><div id="acOpts"></div></fieldset>
      <fieldset><legend>Flight time</legend><div id="bucketOpts"></div></fieldset>
      <fieldset><legend>Only show</legend>
        <label class="opt"><input type="checkbox" id="ownOnly"> Airports I own at both ends</label>
        <label class="opt"><input type="checkbox" id="opsOnly"> Routes with observed traffic</label>
        <label class="opt"><input type="checkbox" id="cargoOnly"> Freighters on cargo routes only</label>
      </fieldset>
      <div class="sheet-foot"><button class="btn" id="reset">Clear filters</button><button class="btn pri" id="sheetGo">Show results</button></div>
    </aside>
    <section>
      <div id="results"><div class="loading"><div class="spin"></div>Loading destinations&hellip;</div></div>
      <p class="disclaimer" id="disclaimer"></p>
    </section>
  </div>
</main>
<div class="fsheet-bg" id="sheetBg"></div>
<script>
'use strict';

const state = {
  data: null, from: null, to: '', ac: new Set(), buckets: new Set(),
  ownOnly: false, opsOnly: false, cargoOnly: false, open: new Set(),
};
const el = (id) => document.getElementById(id);

const FREQ_LABEL = {
  several_daily: 'several times a day',
  daily: 'practically daily',
  weekly: 'weekly',
  seen: 'seen occasionally',
};

// The ledger's dow array uses 1 = Monday: an entry first seen on 2026-08-13,
// a Thursday, is stored as 4.
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const dowLabel = (d) => DOW[Number(d) - 1] || String(d);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtDuration(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`;
}

const isFreighter = (code) => Boolean(state.data.aircraft[code] && state.data.aircraft[code].cargo);

/* ---------- filtering ---------- */

function matches(route, skip) {
  if (route.from !== state.from) return false;
  if (skip !== 'ac' && state.ac.size && !state.ac.has(route.ac)) return false;
  if (skip !== 'bucket' && state.buckets.size && !state.buckets.has(route.bucket)) return false;
  if (state.ownOnly && !(route.own_from && route.own_to)) return false;
  if (state.opsOnly && route.detail !== 'observed') return false;
  // A freighter is only realistic where cargo traffic was actually observed.
  if (state.cargoOnly && isFreighter(route.ac) && !route.cargo_seen) return false;
  if (state.to) {
    const ap = state.data.airports[route.to] || {};
    const hay = `${route.to} ${ap.name || ''} ${ap.city || ''} ${ap.country || ''}`.toLowerCase();
    if (!hay.includes(state.to)) return false;
  }
  return true;
}

// Counts on a facet ignore that facet's own selection, so the numbers show
// what you would get by ticking the box rather than what you have now.
function facetCounts(field, skip) {
  const counts = new Map();
  const seen = new Set();
  for (const r of state.data.routes) {
    if (!matches(r, skip)) continue;
    const dedupe = `${r[field]}|${r.to}`;
    if (seen.has(dedupe)) continue;
    seen.add(dedupe);
    counts.set(r[field], (counts.get(r[field]) || 0) + 1);
  }
  return counts;
}

/* ---------- rendering ---------- */

function renderFacets() {
  const acCounts = facetCounts('ac', 'ac');
  const bucketCounts = facetCounts('bucket', 'bucket');

  el('acOpts').innerHTML = Object.entries(state.data.aircraft)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([code, meta]) => {
      const n = acCounts.get(code) || 0;
      const hint = `${meta.narrowbody ? 'narrowbody' : 'widebody'}${meta.cargo ? ' freighter' : ''}`;
      return `<label class="opt ${n ? '' : 'zero'}" title="${esc(meta.name || code)} · range ${meta.range_nm ?? '?'} nm, usable ${meta.usable_range_nm ?? '?'} nm">
        <input type="checkbox" data-ac="${esc(code)}" ${state.ac.has(code) ? 'checked' : ''}>
        <span>${esc(code)}</span><span class="hint">${hint}</span>
        <span class="count">${n}</span></label>`;
    }).join('');

  el('bucketOpts').innerHTML = state.data.buckets.map((b) => {
    const n = bucketCounts.get(b.id) || 0;
    return `<label class="opt ${n ? '' : 'zero'}">
      <input type="checkbox" data-bucket="${b.id}" ${state.buckets.has(b.id) ? 'checked' : ''}>
      <span>${esc(b.label)}</span><span class="hint">${esc(b.hint)}</span>
      <span class="count">${n}</span></label>`;
  }).join('');

  el('acOpts').querySelectorAll('input').forEach((input) => {
    input.addEventListener('change', () => {
      const code = input.dataset.ac;
      if (input.checked) state.ac.add(code); else state.ac.delete(code);
      update();
    });
  });
  el('bucketOpts').querySelectorAll('input').forEach((input) => {
    input.addEventListener('change', () => {
      const id = input.dataset.bucket;
      if (input.checked) state.buckets.add(id); else state.buckets.delete(id);
      update();
    });
  });
}

function renderResults() {
  const hits = state.data.routes.filter((r) => matches(r));

  if (!hits.length) {
    state.nDest = 0;
    el('results').innerHTML = `<div class="panel empty"><b>No matches.</b>${relaxHints()}</div>`;
    el('results').querySelectorAll('a[data-relax]').forEach((a) => {
      a.addEventListener('click', () => {
        const kind = a.dataset.relax;
        if (kind === 'ac') state.ac.clear();
        if (kind === 'bucket') state.buckets.clear();
        if (kind === 'own') { state.ownOnly = false; el('ownOnly').checked = false; }
        if (kind === 'ops') { state.opsOnly = false; el('opsOnly').checked = false; }
        if (kind === 'cargo') { state.cargoOnly = false; el('cargoOnly').checked = false; }
        if (kind === 'to') { state.to = ''; el('toFilter').value = ''; }
        update();
      });
    });
    return;
  }

  // One row per destination: the shortest block time wins, every other type
  // that also qualifies is listed alongside it. Observed detail is merged from
  // every type on that destination, because the traffic is a property of the
  // route, not of the aircraft you happen to pick.
  const byDest = new Map();
  for (const r of hits) {
    const cur = byDest.get(r.to);
    if (!cur) {
      byDest.set(r.to, { ...r, alts: new Set([r.ac]), obs: collectObserved(null, r) });
      continue;
    }
    cur.alts.add(r.ac);
    cur.obs = collectObserved(cur.obs, r);
    if (r.block_min < cur.block_min) {
      byDest.set(r.to, { ...r, alts: cur.alts, obs: cur.obs });
    }
  }

  const rows = [...byDest.values()];
  state.nDest = rows.length;
  el('results').innerHTML = state.data.buckets.map((b) => {
    const group = rows.filter((r) => r.bucket === b.id).sort((x, y) => x.block_min - y.block_min);
    if (!group.length) return '';
    return `<section class="bucket-group">
      <div class="bucket-head"><h2>${esc(b.label)}</h2><span class="hint">${esc(b.hint)}</span>
        <span class="n">${group.length} destination${group.length === 1 ? '' : 's'}</span></div>
      <div class="panel"><table class="rt"><thead><tr>
        <th>Destination</th><th>Aircraft</th><th class="r">Distance</th><th class="r">Block</th><th>Scenery</th><th>Airlines</th>
      </tr></thead><tbody>
      ${group.map(rowHtml).join('')}
      </tbody></table></div></section>`;
  }).join('');

  el('results').querySelectorAll('button[data-open]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.open;
      if (state.open.has(key)) state.open.delete(key); else state.open.add(key);
      renderResults();
    });
  });
}

// Merge the observed fields of one route record into an accumulator.
function collectObserved(acc, r) {
  if (r.detail !== 'observed') return acc;
  const out = acc || { flights: [], regs: new Set(), time_bands: new Set(), dow: new Set(), seasons: {}, days_seen: 0, freq_band: null, types: new Set(), cargo: false };
  out.types.add(r.ac);
  if (r.cargo_seen) out.cargo = true;
  for (const f of r.flights || []) {
    const key = `${f.airline}|${f.flight}|${f.std}`;
    if (!out.flights.some((x) => `${x.airline}|${x.flight}|${x.std}` === key)) out.flights.push(f);
  }
  for (const g of r.regs || []) out.regs.add(g);
  for (const t of r.time_bands || []) out.time_bands.add(t);
  for (const d of r.dow || []) out.dow.add(d);
  for (const [s, v] of Object.entries(r.seasons || {})) {
    const prev = out.seasons[s];
    out.seasons[s] = prev && prev.days >= (v.days || 0) ? prev : v;
  }
  out.days_seen = Math.max(out.days_seen, r.days_seen || 0);
  const order = ['several_daily', 'daily', 'weekly', 'seen'];
  if (r.freq_band && (!out.freq_band || order.indexOf(r.freq_band) < order.indexOf(out.freq_band))) {
    out.freq_band = r.freq_band;
  }
  return out;
}

function rowHtml(r) {
  const ap = state.data.airports[r.to] || {};
  const alts = [...r.alts].sort();
  const ops = r.operators && r.operators.length
    ? esc(r.operators.join(', '))
    : '<span class="hint">no operator recorded</span>';
  const freq = r.freq_band ? ` <span class="tag">${FREQ_LABEL[r.freq_band] || r.freq_band}</span>` : '';
  const cargo = r.cargo_seen ? ' <span class="tag">cargo seen</span>' : '';
  const scenery = r.own_to
    ? '<span class="tag own">owned</span>'
    : '<span class="tag">not owned</span>';

  // Honest per field, not per row: a record can be observed while its block time
  // is still an estimate, because the ledger has no arrival time.
  let blockTag = ' <span class="tag est">estimated</span>';
  if (r.detail === 'observed') {
    blockTag = r.block_source === 'observed' ? '' : ' <span class="tag est">block estimated</span>';
  }

  const dist = r.routed_nm && r.routed_nm !== r.dist_nm
    ? `${r.dist_nm.toLocaleString('en-GB')} nm<small class="hint"> · ${r.routed_nm.toLocaleString('en-GB')} routed</small>`
    : `${r.dist_nm.toLocaleString('en-GB')} nm`;

  const key = `${r.from}-${r.to}`;
  const isOpen = state.open.has(key);
  const toggle = r.obs
    ? `<button class="toggle" data-open="${key}" aria-expanded="${isOpen}">${isOpen ? 'Hide' : 'Show'} observed traffic</button>`
    : '';

  const main = `<tr${isOpen ? ' class="open"' : ''}>
    <td class="tt dest" data-l="Destination"><span class="v"><span class="dcode">${esc(r.to)}</span><span class="dblock mo">${fmtDuration(r.block_min)}</span><small>${esc(ap.city || ap.name || '')}${ap.country ? ' · ' + esc(ap.country) : ''}</small>${toggle}</span></td>
    <td data-l="Aircraft"><span class="v">${alts.map(esc).join(' / ')}</span></td>
    <td class="r num" data-l="Distance"><span class="v">${dist}</span></td>
    <td class="r num" data-l="Block"><span class="v">${fmtDuration(r.block_min)}${blockTag}</span></td>
    <td data-l="Scenery"><span class="v">${scenery}</span></td>
    <td class="ops" data-l="Airlines"><span class="v">${ops}${freq}${cargo}</span></td>
  </tr>`;

  return isOpen && r.obs ? main + detailHtml(r) : main;
}

function detailHtml(r) {
  const o = r.obs;
  const blocks = [];

  const when = [];
  if (o.time_bands.size) when.push(`<div class="fchips">${[...o.time_bands].map((t) => `<span class="fchip">${esc(t)}</span>`).join('')}</div>`);
  if (o.dow.size) {
    const days = [...o.dow].sort((a, b) => a - b).map(dowLabel);
    when.push(`<div class="fchips">${days.map((d) => `<span class="fchip">${esc(d)}</span>`).join('')}</div>`);
  }
  if (o.days_seen) when.push(`<div class="fchips"><span class="fchip">${o.days_seen} days observed</span></div>`);
  if (o.cargo) when.push('<div class="fchips"><span class="fchip">cargo traffic</span></div>');
  if (when.length) blocks.push(`<div class="detail-block"><h3>When</h3>${when.join('')}</div>`);

  const seasonKeys = Object.keys(o.seasons).sort();
  if (seasonKeys.length) {
    const rows = seasonKeys.map((s) => {
      const v = o.seasons[s] || {};
      const span = v.first && v.last ? `${esc(v.first)} → ${esc(v.last)}` : '';
      return `<span class="fchip">${esc(s)}: ${v.days ?? 0} d ${span}</span>`;
    }).join('');
    blocks.push(`<div class="detail-block"><h3>Seasons</h3><div class="fchips">${rows}</div></div>`);
  }

  if (o.regs.size) {
    blocks.push(`<div class="detail-block"><h3>Registrations</h3><div class="fchips">${
      [...o.regs].sort().map((g) => `<span class="fchip">${esc(g)}</span>`).join('')
    }</div></div>`);
  }

  if (o.types.size) {
    blocks.push(`<div class="detail-block"><h3>Observed on</h3><div class="fchips">${
      [...o.types].sort().map((t) => `<span class="fchip">${esc(t)}</span>`).join('')
    }</div></div>`);
  }

  if (o.flights.length) {
    const rows = o.flights.slice(0, 40).map((f) => `<tr>
      <td>${esc(f.airline || '')} ${esc(f.flight || '')}</td>
      <td class="mono">${esc(f.std || '')}</td>
      <td>${(f.dow || []).map(dowLabel).map(esc).join(' ')}</td>
      <td class="mono">${f.days ?? ''}</td>
      <td class="mono">${esc(f.first_seen || '')} → ${esc(f.last_seen || '')}</td>
      <td>${esc(f.status || '')}</td>
    </tr>`).join('');
    const more = o.flights.length > 40 ? `<tr><td colspan="6" class="hint">… and ${o.flights.length - 40} more</td></tr>` : '';
    blocks.push(`<div class="detail-block wide"><h3>Flights</h3><div class="hscroll">
      <table class="flights"><thead><tr>
        <th>Flight</th><th>STD</th><th>Days</th><th>#</th><th>Seen</th><th>Status</th>
      </tr></thead><tbody>${rows}${more}</tbody></table></div></div>`);
  }

  return `<tr class="detailrow"><td colspan="6" class="full"><div class="detail-grid">${blocks.join('')}</div></td></tr>`;
}

// For an empty result set, report how many options each single relaxation
// would bring back, so the user gets a way out instead of a dead end.
function relaxHints() {
  const snapshot = { ac: state.ac, buckets: state.buckets, ownOnly: state.ownOnly, opsOnly: state.opsOnly, cargoOnly: state.cargoOnly, to: state.to };
  const count = (mutate) => {
    mutate();
    const n = state.data.routes.filter((r) => matches(r)).length;
    Object.assign(state, snapshot);
    return n;
  };
  const tries = [];
  if (state.ac.size) tries.push(['ac', 'without the aircraft filter', count(() => { state.ac = new Set(); })]);
  if (state.buckets.size) tries.push(['bucket', 'without the flight-time filter', count(() => { state.buckets = new Set(); })]);
  if (state.ownOnly) tries.push(['own', 'if scenery you do not own is allowed', count(() => { state.ownOnly = false; })]);
  if (state.opsOnly) tries.push(['ops', 'without requiring observed traffic', count(() => { state.opsOnly = false; })]);
  if (state.cargoOnly) tries.push(['cargo', 'if freighters may fly non-cargo routes', count(() => { state.cargoOnly = false; })]);
  if (state.to) tries.push(['to', 'without the destination filter', count(() => { state.to = ''; })]);
  Object.assign(state, snapshot);
  const useful = tries.filter((t) => t[2] > 0);
  if (!useful.length) return '<p>Try another departure airport.</p>';
  return `<ul>${useful.map(([k, text, n]) => `<li><a data-relax="${k}">${text}</a> there are ${n} options.</li>`).join('')}</ul>`;
}

/* ---------- URL state ---------- */

function toUrl() {
  const p = new URLSearchParams();
  if (state.from) p.set('from', state.from);
  if (state.to) p.set('to', state.to);
  if (state.ac.size) p.set('ac', [...state.ac].join(','));
  if (state.buckets.size) p.set('dur', [...state.buckets].join(','));
  if (state.ownOnly) p.set('own', '1');
  if (state.opsOnly) p.set('ops', '1');
  if (state.cargoOnly) p.set('frt', '1');
  history.replaceState(null, '', `${location.pathname}?${p}`);
}

function fromUrl() {
  const p = new URLSearchParams(location.search);
  state.from = (p.get('from') || '').toUpperCase() || null;
  state.to = (p.get('to') || '').toLowerCase();
  state.ac = new Set((p.get('ac') || '').split(',').filter(Boolean).map((s) => s.toUpperCase()));
  state.buckets = new Set((p.get('dur') || '').split(',').filter(Boolean));
  state.ownOnly = p.get('own') === '1';
  state.opsOnly = p.get('ops') === '1';
  state.cargoOnly = p.get('frt') === '1';
}

function update() {
  renderFacets();
  renderResults();
  toUrl();
  const n = state.ac.size + state.buckets.size + (state.ownOnly ? 1 : 0) + (state.opsOnly ? 1 : 0) + (state.cargoOnly ? 1 : 0);
  el('fcount').textContent = n ? String(n) : '';
  el('fcount').hidden = !n;
  const ap = state.data.airports[state.from] || {};
  el('summary').innerHTML = `<b>${state.nDest || 0}</b> destination${state.nDest === 1 ? '' : 's'} from <b>${esc(state.from)}</b>`
    + `<span class="dk-only faint"> · ${esc(ap.city || ap.name || '')}</span>`;
  el('sheetGo').textContent = `Show ${state.nDest || 0} destination${state.nDest === 1 ? '' : 's'}`;
}

/* ---------- boot ---------- */

function disclaimerText(data) {
  const base = 'Block times come from great-circle distance, a distance-dependent track factor and the cruise speed published in fleet.owned.';
  if (data.detail_level === 'estimated') {
    return `${base} No observed layer is attached yet: frequencies and operators stay empty until publish-find.mjs can read the ledger.`;
  }
  const extra = data.detail_mode === 'full'
    ? 'Rows with observed traffic show the real flight numbers, time bands, weekdays and registrations from the ledger.'
    : 'Rows with observed traffic show derived facts only: frequency band, time bands and operator names.';
  return `${base} The ledger records no arrival time, so a block time stays an estimate; rows say "block estimated" where that applies. ${extra}`;
}

async function boot() {
  let data;
  try {
    const res = await fetch('find.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    RW.setMeta('find.json not loaded');
    el('results').innerHTML = `<div class="panel empty"><b>Could not load find.json.</b>
      <p>Run <code>node scripts/publish-find.mjs</code> and commit <code>docs/find.json</code>.</p>
      <p class="hint">${esc(err.message)}</p></div>`;
    return;
  }
  state.data = data;

  const origins = [...new Set(data.routes.map((r) => r.from))].sort();
  fromUrl();
  if (!state.from || !origins.includes(state.from)) state.from = origins.includes('EHAM') ? 'EHAM' : origins[0];

  el('from').innerHTML = origins.map((code) => {
    const ap = data.airports[code] || {};
    return `<option value="${esc(code)}" ${code === state.from ? 'selected' : ''}>${esc(code)} — ${esc(ap.city || ap.name || '')}</option>`;
  }).join('');
  el('toFilter').value = state.to;
  el('ownOnly').checked = state.ownOnly;
  el('opsOnly').checked = state.opsOnly;
  el('cargoOnly').checked = state.cargoOnly;

  el('from').addEventListener('change', (e) => { state.from = e.target.value; state.open.clear(); update(); });
  el('toFilter').addEventListener('input', (e) => { state.to = e.target.value.trim().toLowerCase(); update(); });
  el('ownOnly').addEventListener('change', (e) => { state.ownOnly = e.target.checked; update(); });
  el('opsOnly').addEventListener('change', (e) => { state.opsOnly = e.target.checked; update(); });
  el('cargoOnly').addEventListener('change', (e) => { state.cargoOnly = e.target.checked; update(); });
  const openF = (v) => { document.body.classList.toggle('fopen', v); };
  el('filtersBtn').addEventListener('click', () => openF(true));
  el('sheetBg').addEventListener('click', () => openF(false));
  el('sheetGo').addEventListener('click', () => { openF(false); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  el('sheetClose').addEventListener('click', () => openF(false));
  el('reset').addEventListener('click', () => {
    state.ac.clear();
    state.buckets.clear();
    state.to = '';
    el('toFilter').value = '';
    state.ownOnly = false; el('ownOnly').checked = false;
    state.opsOnly = false; el('opsOnly').checked = false;
    state.cargoOnly = false; el('cargoOnly').checked = false;
    state.open.clear();
    update();
  });

  const c = data.counts || {};
  const parts = [
    `${Object.keys(data.airports).length} airports`,
    c.fleet_types ? `${c.fleet_types} types` : null,
    `${data.routes.length.toLocaleString('en-GB')} combinations`,
    c.observed_rows ? `${c.observed_rows.toLocaleString('en-GB')} observed` : null,
    `updated ${data.generated_on}`,
  ].filter(Boolean);
  RW.setMeta(`<span>${esc(parts[parts.length - 1])}</span><span class="long">&middot; ${esc(parts.slice(0, -1).join(' · '))}</span>`);
  el('disclaimer').textContent = disclaimerText(data);

  update();
}

boot();
</script>
</body>
</html>
