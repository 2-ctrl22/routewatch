<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RouteWatch</title>
<meta name="description" content="Real flights between the airports you own in the sim, and which airport to buy next.">
<meta name="theme-color" content="#0a0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body data-page="overview">
<script src="assets/rw-shell.js?v=3"></script>
<main class="rw-main" id="app"><div class="loading"><div class="spin"></div>Loading RouteWatch&hellip;</div></main>
<script>
let D=null;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const nf=n=>Number(n||0).toLocaleString('en-GB');
const pct=(a,b)=>b?Math.round(a/b*100):0;
const cut=(arr,n)=>{const a=arr||[];return a.length<=n?esc(a.join(', ')):esc(a.slice(0,n).join(', '))+' <span class="faint">+'+(a.length-n)+'</span>';};
/* Older runs wrote this sentinel in Dutch, newer runs write it in English. */
const NOSVC=s=>{const v=String(s??'');return v==='GEEN VERBINDING'||v==='NO SERVICE';};

/* data/events.json keeps up to 3000 historical events, and the older ones stay
 * Dutch forever, so display-time translation has to remain. */
const EN=[[/GEEN VERBINDING/g,'NO SERVICE'],[/ONBEKEND/g,'UNKNOWN'],
          [/kandidaat/g,'candidate'],[/bronnen/g,'sources'],
          [/\bvan\b/g,'from'],[/\bnaar\b/g,'to'],[/\bnieuw\b/g,'new'],[/\beerder\b/g,'previously'],
          [/\bdagen\b/g,'days'],[/\bwaargenomen\b/g,'observed'],[/\bvorig\b/g,'previous'],
          [/\bwinkel\b/g,'store'],[/\btegenseizoen\b/g,'counter season'],
          [/laatst_gezien/g,'last_seen'],[/gemiste_gelegenheden/g,'missed_opportunities'],
          [/eerste_verbinding/g,'first_connection'],[/geen_actieve_vluchtregel/g,'no_active_flight_line'],
          [/hervat_op/g,'resumed_on'],[/aandeel_/g,'share_'],[/toelichting/g,'note']];
const en=s=>{let o=String(s??'');for(const r of EN)o=o.replace(r[0],r[1]);return o;};
/* Sorting runs on raw values, never on the rendered text. */
function sortRows(rows,keys,st){
  const get=keys[st.key];
  if(!get) return rows;
  return rows.slice().sort((a,b)=>{
    const x=get(a), y=get(b);
    const c=(typeof x==='number'&&typeof y==='number')
      ? x-y : String(x).localeCompare(String(y),'en');
    return c*st.dir;
  });
}
/* ------------------------------------------------------- plain language --- */
const TYPES={B733:'Boeing 737-300',B734:'Boeing 737-400',B735:'Boeing 737-500',
 B736:'Boeing 737-600',B737:'Boeing 737-700',B738:'Boeing 737-800',B739:'Boeing 737-900',
 B73H:'Boeing 737-800',B73Y:'Boeing 737-800 freighter',B738F:'Boeing 737-800 freighter',
 B734F:'Boeing 737-400 freighter',B752:'Boeing 757-200',B753:'Boeing 757-300',
 B37M:'Boeing 737 MAX 7',B38M:'Boeing 737 MAX 8',B38X:'Boeing 737 MAX 8-200',B39M:'Boeing 737 MAX 9',
 B762:'Boeing 767-200',B763:'Boeing 767-300',B764:'Boeing 767-400',
 B772:'Boeing 777-200',B77L:'Boeing 777F',B77F:'Boeing 777F',B77W:'Boeing 777-300ER',B773:'Boeing 777-300',
 B788:'Boeing 787-8',B789:'Boeing 787-9',B78X:'Boeing 787-10',B744:'Boeing 747-400',B748:'Boeing 747-8',
 BCS1:'Airbus A220-100',BCS3:'Airbus A220-300',
 A318:'Airbus A318',A319:'Airbus A319',A320:'Airbus A320',A321:'Airbus A321',
 A19N:'Airbus A319neo',A20N:'Airbus A320neo',A21N:'Airbus A321neo',
 A332:'Airbus A330-200',A333:'Airbus A330-300',A338:'Airbus A330-800neo',A339:'Airbus A330-900neo',
 A343:'Airbus A340-300',A346:'Airbus A340-600',A359:'Airbus A350-900',A35K:'Airbus A350-1000',
 A388:'Airbus A380-800',
 E145:'Embraer ERJ-145',E170:'Embraer E170',E175:'Embraer E175',E190:'Embraer E190',E195:'Embraer E195',
 E290:'Embraer E190-E2',E295:'Embraer E195-E2',
 AT43:'ATR 42',AT45:'ATR 42-500',AT46:'ATR 42-600',AT72:'ATR 72',AT75:'ATR 72-500',AT76:'ATR 72-600',
 DH8A:'Dash 8-100',DH8C:'Dash 8-300',DH8D:'Dash 8 Q400',
 CRJ2:'Bombardier CRJ200',CRJ7:'Bombardier CRJ700',CRJ9:'Bombardier CRJ900',CRJX:'Bombardier CRJ1000',
 SB20:'Saab 2000',SF34:'Saab 340',SW4:'Fairchild Metro',
 F70:'Fokker 70',F100:'Fokker 100',MD11:'McDonnell Douglas MD-11'};
function prettyType(s){
  const k=String(s||'').trim().toUpperCase();
  if(TYPES[k]) return TYPES[k];
  const words=k.split(/\s+/).map(w=>{
    if(w==='NEO') return 'neo';
    if(/\d/.test(w)) return w;
    return w.charAt(0)+w.slice(1).toLowerCase();
  });
  return words.join(' ').replace(/ neo/g,'neo');
}
/* Airline names come from data.json, where routewatch.mjs collects them from the
 * sources themselves. So a new or renamed carrier needs no edit here. The small
 * table below is only a fallback for codes the data has not named yet, mostly
 * OpenSky callsign prefixes. */
const FALLBACK={
 KL:'KLM',KLM:'KLM',KLC:'KLM Cityhopper',HV:'Transavia',TRA:'Transavia',TVF:'Transavia France',
 AF:'Air France',AFR:'Air France',BA:'British Airways',BAW:'British Airways',
 LH:'Lufthansa',DLH:'Lufthansa',CLH:'Lufthansa CityLine',LX:'Swiss',SWR:'Swiss',
 OS:'Austrian Airlines',AUA:'Austrian Airlines',SN:'Brussels Airlines',BEL:'Brussels Airlines',
 EW:'Eurowings',EWG:'Eurowings',OCN:'Discover Airlines',DE:'Condor',CFG:'Condor',
 FR:'Ryanair',RYR:'Ryanair',RUK:'Ryanair UK',MAY:'Malta Air',
 U2:'easyJet',EZY:'easyJet',EJU:'easyJet Europe',EZS:'easyJet Switzerland',
 VY:'Vueling',VLG:'Vueling',IB:'Iberia',IBE:'Iberia',IBS:'Iberia Express',ANE:'Air Nostrum',
 UX:'Air Europa',AEA:'Air Europa',TP:'TAP Air Portugal',TAP:'TAP Air Portugal',
 AZ:'ITA Airways',ITY:'ITA Airways',A3:'Aegean Airlines',AEE:'Aegean Airlines',
 OA:'Olympic Air',OAL:'Olympic Air',GQ:'Sky Express',SEH:'Sky Express',
 SK:'SAS',SAS:'SAS',DY:'Norwegian',NAX:'Norwegian',IBK:'Norwegian Sweden',
 AY:'Finnair',FIN:'Finnair',BT:'airBaltic',BTI:'airBaltic',WIF:'Wideroe',
 FI:'Icelandair',ICE:'Icelandair',FPY:'Play',
 LO:'LOT Polish Airlines',LOT:'LOT Polish Airlines',
 W6:'Wizz Air',WZZ:'Wizz Air',W4:'Wizz Air Malta',WMT:'Wizz Air Malta',W9:'Wizz Air UK',WUK:'Wizz Air UK',
 LG:'Luxair',LGL:'Luxair',EI:'Aer Lingus',EIN:'Aer Lingus',LS:'Jet2',EXS:'Jet2',
 BY:'TUI Airways',TOM:'TUI Airways',TUI:'TUI fly Germany',JAF:'TUI fly Belgium',
 TK:'Turkish Airlines',THY:'Turkish Airlines',PC:'Pegasus Airlines',PGT:'Pegasus Airlines',
 XQ:'SunExpress',SXS:'SunExpress',
 QR:'Qatar Airways',QTR:'Qatar Airways',EK:'Emirates',UAE:'Emirates',
 EY:'Etihad Airways',ETD:'Etihad Airways',KU:'Kuwait Airways',KAC:'Kuwait Airways',
 GF:'Gulf Air',GFA:'Gulf Air',SV:'Saudia',SVA:'Saudia',MS:'EgyptAir',MSR:'EgyptAir',
 AT:'Royal Air Maroc',RAM:'Royal Air Maroc',ET:'Ethiopian Airlines',ETH:'Ethiopian Airlines',
 SA:'South African Airways',SAA:'South African Airways',
 UA:'United Airlines',UAL:'United Airlines',AA:'American Airlines',AAL:'American Airlines',
 DL:'Delta Air Lines',DAL:'Delta Air Lines',AC:'Air Canada',ACA:'Air Canada',
 NZ:'Air New Zealand',ANZ:'Air New Zealand',SQ:'Singapore Airlines',SIA:'Singapore Airlines',
 CX:'Cathay Pacific',CPA:'Cathay Pacific',JL:'Japan Airlines',NH:'ANA',
 FX:'FedEx Express',FDX:'FedEx Express','5X':'UPS Airlines',UPS:'UPS Airlines',
 QY:'EAT Leipzig (DHL)',BCS:'EAT Leipzig (DHL)',DHK:'DHL Air UK',
 '3V':'ASL Airlines Belgium',TAY:'ASL Airlines Belgium',
 '5O':'ASL Airlines France',FPO:'ASL Airlines France',
 T2:'West Atlantic Sweden',SWN:'West Atlantic Sweden',NPT:'West Atlantic UK',
 DJ:'Maersk Air Cargo',SRR:'Maersk Air Cargo',CV:'Cargolux',CLX:'Cargolux',
 MP:'Martinair Cargo',MPH:'Martinair Cargo',GEC:'Lufthansa Cargo',BOX:'AeroLogic',
 GTI:'Atlas Air',CKS:'Kalitta Air'};
/* data first, fallback second. */
const airlineName=c=>{
  const k=String(c||'').trim().toUpperCase();
  if(!k) return null;
  return (D&&D.airlines&&D.airlines[k]) || FALLBACK[k] || null;
};
function opList(arr,n){
  const a=arr||[]; if(!a.length) return '-';
  const out=a.slice(0,n).map(c=>{const name=airlineName(c);
    return name
      ? '<span class="op" title="'+esc(name)+'">'+esc(c)+'</span>'
      : '<span class="op unk" title="no name for '+esc(c)+' yet, it will be filled in by the next run">'
        +esc(c)+'</span>';
  }).join(' ');
  return out+(a.length>n?' <span class="muted">+'+(a.length-n)+'</span>':'');
}
const KINDS={ROUTE_NEW:'New route',ROUTE_GONE:'Route disappeared',ROUTE_BACK:'Route is back',
 PAIR_NEW:'First ever connection',PAIR_GONE:'No flights left on this pair',
 TYPE_NEW:'Different aircraft',TYPE_GONE:'Aircraft no longer used',
 TYPE_MIX_SHIFT:'Aircraft mix shifted',MATCH_CHANGED:'Fleet match changed',
 SIMMABLE_CHANGED:'Session fit changed',DOW_PATTERN_CHANGE:'Flies on different days',
 SEASON_NEW:'New this season',SEASON_NOT_RETURNING:'Not back this season',
 SEASON_TYPE_SWAP:'Different aircraft per season',SEASON_TIME_SHIFT:'Departure time shifted',
 CANDIDATE_GAIN_UP:'Wishlist airport worth more now',PRICE_DROP:'Price dropped',
 AIRLINE_RENAMED:'Airline changed its name',
 SUSPENDED:'Paused, not seen for a while',RESUMED:'Flying again'};
const kindLabel=k=>KINDS[k]||String(k||'').replace(/_/g,' ').toLowerCase()
  .replace(/^./,c=>c.toUpperCase());
function flyRank(st){
  const s=String(st||'');
  if(NOSVC(s)) return 0;
  if(s.startsWith('MATCH')) return 4;
  if(s.startsWith('NEAR')) return 3;
  if(s.startsWith('NO-')) return 2;
  return 1;
}
function sureText(c){
  const s=en(String(c||''));
  const d=s.match(/n=(\d+)\s*d/i), src=s.match(/sources=(\d+)/i);
  if(!d&&!src) return esc(s)||'<span class="muted">-</span>';
  const parts=[];
  if(d) parts.push(d[1]+(d[1]==='1'?' day':' days')+' of data');
  if(src) parts.push(src[1]+(src[1]==='1'?' source':' sources'));
  return '<span class="muted">'+parts.join(', ')+'</span>';
}
function fmtWhen(at){
  const s=String(at||'');
  const d=new Date(s);
  if(isNaN(d)) return s.slice(0,16);
  const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  const p=n=>String(n).padStart(2,'0');
  return d.getDate()+' '+mon+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function lastSunday(year,month){
  const d=new Date(Date.UTC(year,month+1,0));
  d.setUTCDate(d.getUTCDate()-d.getUTCDay());
  return d;
}
function seasonOf(at){
  const d=new Date(at);
  if(isNaN(d)) return '';
  const y=d.getUTCFullYear();
  const s=lastSunday(y,2), w=lastSunday(y,9);
  if(d>=s&&d<w) return 'S'+String(y).slice(2);
  if(d<s) return 'W'+String(y-1).slice(2);
  return 'W'+String(y).slice(2);
}

/* ================================================================ render === */
const BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>';
let APMAP={};

function flyText(st){
  const s=String(st||'');
  if(NOSVC(s)) return '<span class="st o">No flights seen</span>';
  if(s.startsWith('MATCH')) return '<span class="st m" title="You own this aircraft">You own it</span>';
  if(s.startsWith('NEAR')) return '<span class="st n" title="A close substitute is in your fleet">Substitute</span>';
  if(s.startsWith('NO-')) return '<span class="st x" title="Not in your fleet">Not in fleet</span>';
  return '<span class="st o">Unknown</span>';
}
const yesNo=b=>b?'<span class="st m">Yes</span>':'<span class="faint">No</span>';
const typesShort=(t,n=3)=>{const a=(t||[]).map(prettyType);
  const u=[...new Set(a)];
  return u.length?esc(u.slice(0,n).join(', '))+(u.length>n?' <span class="faint">+'+(u.length-n)+'</span>':''):'<span class="faint">-</span>';};
const dash='<span class="faint">-</span>';

/* One table builder for every list. Desktop: a sortable table. Phone: the same
 * rows as cards, each cell labelled from its column. */
let SORTFN=null;
app.addEventListener('click',e=>{
  const th=e.target.closest('th[data-sort]');
  if(th&&SORTFN) SORTFN(th.dataset.sort);
});
function table(cols,rows,opt){
  opt=opt||{};
  const st=opt.sort;
  const th=cols.map(c=>{
    const sortable=!!(c.k&&st), on=sortable&&st.key===c.k;
    const cl=[(c.cls||'').split(' ').includes('r')?'r':'',sortable?'s':'',on?'on':''].filter(Boolean).join(' ');
    return '<th'+(cl?' class="'+cl+'"':'')+(sortable?' data-sort="'+c.k+'" title="Sort"':'')+'>'+c.l
      +(on?'<span class="arw">'+(st.dir>0?'&#9650;':'&#9660;')+'</span>':'')+'</th>';
  }).join('');
  const body=rows.length?rows.map(r=>'<tr'+(r.cls?' class="'+r.cls+'"':'')+(r.title?' title="'+esc(r.title)+'"':'')+'>'
      +r.cells.map((h,i)=>{const c=cols[i];
        const nil=(h===dash||h==='-'||h===''||h===undefined||h===null)&&!(c.cls||'').includes('tt');
        const cl=((c.cls||'')+(nil?' nil':'')).trim();
        return '<td'+(cl?' class="'+cl+'"':'')+' data-l="'+esc(c.ml||c.l)+'"><span class="v">'+(h??'')+'</span></td>';}).join('')
      +'</tr>').join('')
    :'<tr><td class="empty" colspan="'+cols.length+'">'+(opt.empty||'Nothing here yet.')+'</td></tr>';
  return '<div class="panel"><div class="scroll"><table class="rt"><thead><tr>'+th+'</tr></thead><tbody>'
    +body+'</tbody></table></div>'+(opt.after||'')+'</div>';
}
function sortSelect(id,opts,st){
  return '<select class="mo-only sortsel" id="'+id+'" aria-label="Sort">'+opts.map(o=>
    '<option value="'+o[0]+':'+o[1]+'"'+(st.key===o[0]&&st.dir===o[1]?' selected':'')+'>'+o[2]+'</option>').join('')
    +'</select>';
}
const readSort=v=>{const [k,d]=String(v).split(':');return {key:k,dir:Number(d)};};
function title(h,p,right){
  return '<div class="page-title"><div><h1>'+h+'</h1>'+(p?'<p>'+p+'</p>':'')+'</div>'+(right||'')+'</div>';
}

/* ------------------------------------------------------------ changes ---- */
const EVCOLS=[{l:'What happened',cls:'tt'},{l:'When',cls:'nowrap'},{l:'Route',cls:'nowrap'},
  {l:'Flight',cls:'nowrap'},{l:'Season',cls:'hm'},{l:'Distance',cls:'r num'},{l:'Aircraft'},
  {l:'Can you fly it?',ml:'Your fleet',cls:'nowrap'},{l:'How sure',cls:'hm small'}];
function evRows(list){
  return list.map(e=>{
    const d=e.detail||{}, ts=(d.types||[]).map(prettyType);
    const seas=e.season||seasonOf(e.at);
    const wish=d.candidate??d.kandidaat;
    return {cls:'sev-'+esc(e.severity||'low'),title:en(JSON.stringify(d)),cells:[
      esc(kindLabel(e.kind))+(wish?' <span class="tag wish">wishlist</span>':'')
        +(typeof d.from==='string'&&typeof d.to==='string'?'<span class="sub">'+esc(d.from)+' &rarr; '+esc(d.to)+'</span>':''),
      esc(fmtWhen(e.at)),
      e.pair?'<a href="#route/'+esc(e.pair)+'">'+esc(e.pair)+'</a>':dash,
      e.airline?opList([e.airline],1)+' '+esc(e.flight||''):(e.flight?esc(e.flight):dash),
      seas?esc(seas):dash,
      d.nm?nf(d.nm)+' NM':dash,
      ts.length?esc([...new Set(ts)].join(', ')):dash,
      d.status?flyText(d.status):dash,
      sureText(e.confidence)
    ]};
  });
}
function evTable(list,opt){
  return table(EVCOLS,evRows(list),Object.assign({empty:'Nothing has changed yet.'},opt||{}));
}

/* ----------------------------------------------------------- overview ---- */
function ov(){
  SORTFN=null;
  const s=D.summary, served=D.pairs.filter(p=>!NOSVC(p.status));
  const cM=served.filter(p=>String(p.status).startsWith('MATCH')).length;
  const cN=served.filter(p=>String(p.status).startsWith('NEAR')).length;
  const cX=served.length-cM-cN;
  const tot=s.pairs_possible||D.pairs.length||1;
  const seg=(n,c)=>n?'<i style="width:'+(n/tot*100).toFixed(2)+'%;background:'+c+'"></i>':'';
  const stats=[
    [s.airports,'Airports you own','acc'],
    [s.candidates,'Wishlist airports being measured'],
    [s.pairs_served,'Pairs with real flights'],
    [s.pairs_simmable,'Pairs that fit a sim session'],
    [s.cargo_pairs,'Pairs flown by cargo aircraft'],
    [s.suspended,'Routes paused after repeated absence']];
  if(s.airlines_known!==undefined) stats.push([s.airlines_known,'Airlines named automatically']);
  if(s.registrations!==undefined) stats.push([s.registrations,'Aircraft registrations collected']);
  app.innerHTML=title('Overview','Which flights really operate between the airports you own, and what you can fly with the aircraft in your hangar.')
   +'<div class="hero">'
   +'<div class="panel"><div class="lbl">Flyable today</div><div class="big" style="margin-top:8px">'+nf(s.pairs_match)+'</div>'
   +'<div class="big-sub">routes you can fly with your own fleet</div>'
   +'<div class="big-note">Out of '+nf(s.pairs_served)+' airport pairs with real flights. '
   +'<a href="#routes" data-filter="match">Show them</a></div></div>'
   +'<div class="panel"><div class="lbl">Network coverage</div>'
   +'<div style="display:flex;align-items:baseline;gap:8px;margin-top:8px"><span class="val">'+pct(s.pairs_served,tot)+'%</span>'
   +'<span class="muted small">of '+nf(tot)+' possible pairs have flights</span></div>'
   +'<div class="meter">'+seg(cM,'var(--ok)')+seg(cN,'var(--warn)')+seg(cX,'#5b6b80')+'</div>'
   +'<div class="legend"><span><i style="background:var(--ok)"></i>You own it '+nf(cM)+'</span>'
   +'<span><i style="background:var(--warn)"></i>Substitute '+nf(cN)+'</span>'
   +'<span><i style="background:#5b6b80"></i>Not in fleet '+nf(cX)+'</span>'
   +'<span><i style="background:var(--s3)"></i>No flights '+nf(tot-served.length)+'</span></div></div>'
   +'</div>'
   +'<div class="stats s4">'+stats.map(x=>'<div class="stat '+(x[2]||'')+'"><b>'+nf(x[0])+'</b><span>'+x[1]+'</span></div>').join('')+'</div>'
   +'<h2 class="sec">Latest changes <span class="count">'+nf(s.new_events)+' in the last run</span>'
   +'<a href="#changes" style="margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px">See all</a></h2>'
   +evTable(D.events.slice(0,30))
   +'<p class="note">Every run is compared against a stored history, not just yesterday. A day without data '
   +'counts as a miss rather than a change, and a route is only marked as paused after several misses in a row, '
   +'so one quiet day never raises a false alarm.</p>';
  app.querySelector('a[data-filter]').addEventListener('click',()=>{prFilter='match';prPage=1;});
}

/* ------------------------------------------------------------- routes ---- */
let prSort={key:'status',dir:-1}, prFilter='all', prPage=1, prQ='';
const PAGE=150;
const PRKEYS={
  pair:p=>String(p.pair||''),
  airports:p=>String(p.from||''),
  nm:p=>Number(p.nm||0),
  operators:p=>(p.operators||[]).length,
  types:p=>(p.types||[]).length,
  status:p=>flyRank(p.status)*100000-Number(p.nm||0)/100,
  simmable:p=>p.simmable?1:0
};
const PRF=[['all','All'],['match','Flyable'],['served','With flights'],['simmable','Fits a session'],
  ['cargo','Cargo'],['unserved','No flights']];
const prIs=(p,f)=>f==='all'||(f==='served'&&!NOSVC(p.status))||(f==='unserved'&&NOSVC(p.status))
  ||(f==='match'&&String(p.status).startsWith('MATCH'))||(f==='simmable'&&p.simmable)||(f==='cargo'&&p.cargo);
const hay=p=>p._h||(p._h=[p.pair,p.from,p.to].concat(p.operators||[],(p.operators||[]).map(o=>airlineName(o)||''),
  p.types||[],(p.types||[]).map(prettyType)).join(' ').toUpperCase());
const PRCOLS=[{l:'Route',k:'pair',cls:'tt'},{l:'Airports',k:'airports',cls:'hm'},{l:'Distance',k:'nm',cls:'r num'},
  {l:'Operators',k:'operators'},{l:'Aircraft',k:'types'},{l:'Can you fly it?',ml:'Your fleet',k:'status',cls:'nowrap'},
  {l:'Fits a session',ml:'One session',k:'simmable'}];

function pr(){
  SORTFN=k=>{prSort=prSort.key===k?{key:k,dir:-prSort.dir}:{key:k,dir:(k==='pair'||k==='airports')?1:-1};
    prPage=1;const sel=document.getElementById('prSortSel');if(sel)sel.value=prSort.key+':'+prSort.dir;renderPR();};
  const counts=Object.fromEntries(PRF.map(f=>[f[0],D.pairs.filter(p=>prIs(p,f[0])).length]));
  app.innerHTML=title('Routes','Every airport pair in your network. Tap a route for its flights, seasons and changes.')
   +'<div class="toolbar"><div class="chips scrollx" id="prChips">'
   +PRF.map(f=>'<span class="chip'+(f[0]===prFilter?' on':'')+'" data-f="'+f[0]+'">'+f[1]
     +' <span class="n">'+nf(counts[f[0]])+'</span></span>').join('')+'</div>'
   +'<div class="search">'+SEARCH+'<input id="q" type="search" placeholder="ICAO, city, airline or aircraft" '
   +'autocomplete="off" value="'+esc(prQ)+'"></div>'
   +sortSelect('prSortSel',[['status',-1,'Flyable first'],['nm',-1,'Longest first'],['nm',1,'Shortest first'],
     ['operators',-1,'Most airlines'],['pair',1,'A to Z']],prSort)+'</div>'
   +'<div id="prt"></div>'
   +'<p class="note">Sorted by what you can fly, best first. On a computer, click a column heading to sort and '
   +'click it again to reverse. Point at an airline code to see its name.</p>';
  document.getElementById('prChips').addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    prFilter=c.dataset.f; prPage=1;
    document.querySelectorAll('#prChips .chip').forEach(x=>x.classList.toggle('on',x===c));
    renderPR();
  });
  let t=null;
  document.getElementById('q').addEventListener('input',e=>{clearTimeout(t);
    t=setTimeout(()=>{prQ=e.target.value.trim();prPage=1;renderPR();},120);});
  document.getElementById('prSortSel').addEventListener('change',e=>{prSort=readSort(e.target.value);prPage=1;renderPR();});
  renderPR();
}
function renderPR(){
  let ps=D.pairs.filter(p=>prIs(p,prFilter));
  if(prQ){const q=prQ.toUpperCase();ps=ps.filter(p=>hay(p).includes(q));}
  const shown=sortRows(ps,PRKEYS,prSort).slice(0,PAGE*prPage);
  const rows=shown.map(p=>({cells:[
    '<a class="lnk" href="#route/'+esc(p.pair)+'">'+esc(p.pair)+'</a><span class="sub mo">'+esc(p.from)+' &ndash; '+esc(p.to)+'</span>',
    esc(p.from)+' &ndash; '+esc(p.to),
    nf(p.nm)+' NM',
    opList(p.operators,6),
    typesShort(p.types),
    flyText(p.status),
    yesNo(p.simmable)]}));
  const more=shown.length<ps.length?'<button class="more-btn" id="prMore">Show '
    +Math.min(PAGE,ps.length-shown.length)+' more &middot; '+nf(shown.length)+' of '+nf(ps.length)+'</button>':'';
  document.getElementById('prt').innerHTML='<h2 class="sec">'+nf(ps.length)+' route'+(ps.length===1?'':'s')
    +(prQ?' <span class="count">matching &ldquo;'+esc(prQ)+'&rdquo;</span>':'')+'</h2>'
    +table(PRCOLS,rows,{sort:prSort,after:more,empty:'No routes match. Try another filter or search.'});
  const mb=document.getElementById('prMore');
  if(mb) mb.onclick=()=>{prPage++;renderPR();};
}

/* ------------------------------------------------------- route detail ---- */
function pd(p){
  SORTFN=null;
  const o=D.pairs.find(x=>x.pair===p);
  if(!o){app.innerHTML='<a class="back" href="#routes">'+BACK+'Routes</a><div class="panel empty-state"><b>Route not found</b>'
    +esc(p)+' is not in the latest data.</div>';return;}
  const q=p.split('-');
  const night=c=>esc(en((APMAP[c]||{}).night||'not established'));
  const legs=o.legs||[];
  app.innerHTML='<a class="back" href="#routes">'+BACK+'Routes</a>'
   +title(esc(q[0])+' &ndash; '+esc(q[1]),esc(o.from)+' &ndash; '+esc(o.to)+' &middot; '+nf(o.nm)+' NM',
     '<div class="chips">'+flyText(o.status)+(o.simmable?'<span class="st m">Fits a session</span>':'')
     +(o.cargo?'<span class="st c">Cargo</span>':'')+'</div>')
   +'<div class="panel pad"><dl class="kv"><dt>Night rules '+esc(q[0])+'</dt><dd>'+night(q[0])+'</dd>'
   +'<dt>Night rules '+esc(q[1])+'</dt><dd>'+night(q[1])+'</dd></dl></div>'
   +'<h2 class="sec">Flights on this route <span class="count">'+legs.length+'</span></h2>'
   +table([{l:'Flight',cls:'tt'},{l:'Aircraft (times seen)',ml:'Aircraft'},{l:'Can you fly it?',ml:'Your fleet',cls:'nowrap'},
     {l:'Days',cls:'r num'},{l:'Departure',cls:'r num'},{l:'Sources',cls:'hm small'},{l:'First and last seen',ml:'Seen',cls:'nowrap small'}],
     legs.map(l=>({cells:[
       esc(l.flight)+' <span class="sub">'+(airlineName(l.airline)?esc(airlineName(l.airline)):opList([l.airline],1))+'</span>',
       esc(Object.entries(l.types||{}).map(x=>prettyType(x[0])+' ×'+x[1]).join(', ')),
       flyText(l.status),l.days,esc(l.std||'-'),esc((l.sources||[]).join(', ')),
       esc(l.first)+' &rarr; '+esc(l.last)]})),{empty:'No flights recorded on this route.'})
   +'<h2 class="sec">Per season</h2>'
   +table([{l:'Season',cls:'tt'},{l:'Flight'},{l:'From',cls:'nowrap'},{l:'To',cls:'nowrap'},{l:'Days',cls:'r num'},
     {l:'Aircraft'},{l:'Departure',cls:'r num'}],
     legs.flatMap(l=>Object.entries(l.seasons||{}).map(x=>({cells:[
       esc(x[0]),esc(l.flight),esc(x[1].first),esc(x[1].last),x[1].days,
       esc(Object.keys(x[1].types||{}).map(prettyType).join(', ')),esc(x[1].std||'-')]}))),
     {empty:'No season data yet.'})
   +'<h2 class="sec">Changes on this route</h2>'+evTable(D.events.filter(e=>e.pair===p));
}

/* ---------------------------------------------------------- buy advice --- */
const TPL={fsaddoncompare:'https://www.fsaddoncompare.com/search?q=',
  simmarket:'https://secure.simmarket.com/?s=',contrail:'https://contrail.co.uk/?s=',
  orbx:'https://orbxdirect.com/search?q=',inibuilds:'https://www.inibuilds.com/search?q=',
  aerosoft:'https://www.aerosoft.com/en/search?q=',
  justflight:'https://www.justflight.com/searchresults?searchterm='};
const STORE={fsaddoncompare:'FSAddonCompare',simmarket:'simMarket',contrail:'Contrail',orbx:'Orbx',
  inibuilds:'iniBuilds',aerosoft:'Aerosoft',justflight:'Just Flight'};
const cityOf=n=>String(n||'').split(/[\s\/-]+/)[0];
const PRICES_NOTE='RouteWatch does not compare shop prices itself. FSAddonCompare already does that '
 +'across Aerosoft, Contrail, Flightsim.to, iniBuilds, Just Flight, Orbx, simMarket and the Marketplace, '
 +'with price history and sale alerts. To pull prices into this dashboard anyway, set settings.price_scrape '
 +'to true and fill price_urls per candidate with direct product URLs; the app then reads the schema.org '
 +'JSON-LD price field. Off by default, because scraping is fragile and shops set their own terms.';

let buSort={key:'match',dir:-1};
const BUKEYS={
  icao:c=>String(c.icao||''),focus:c=>String(c.focus||''),
  new:c=>Number(c.gain?.new_pairs||0),match:c=>Number(c.gain?.match_pairs||0),
  sim:c=>Number(c.gain?.simmable_pairs||0),cargo:c=>Number(c.gain?.cargo_pairs||0)};

function bu(){
  SORTFN=k=>{buSort=buSort.key===k?{key:k,dir:-buSort.dir}:{key:k,dir:(k==='icao'||k==='focus')?1:-1};renderBU();};
  const cs=D.candidates||[];
  if(!cs.length){app.innerHTML=title('Buy advice')+'<div class="panel empty-state"><b>No candidates measured yet</b>'
   +'Add an airport with <code>"candidate": true</code> in config/collection.json and run the workflow.</div>';return;}
  app.innerHTML=title('Buy advice','Every number is counted, not guessed: routes where flights were really seen between '
   +'the airports you own and the candidate. The higher, the more new flying a purchase unlocks.')
   +'<div class="toolbar">'+sortSelect('buSortSel',[['match',-1,'Most flyable routes'],['new',-1,'Most new routes'],
     ['sim',-1,'Most session-length'],['cargo',-1,'Most cargo'],['icao',1,'A to Z']],buSort)+'</div>'
   +'<div id="but"></div>'
   +'<details class="fold"><summary>About prices</summary><p class="note">'+PRICES_NOTE+'</p></details>';
  document.getElementById('buSortSel').addEventListener('change',e=>{buSort=readSort(e.target.value);renderBU();});
  renderBU();
}
function renderBU(){
  const rows=sortRows(D.candidates||[],BUKEYS,buSort);
  document.getElementById('but').innerHTML=table(
    [{l:'Airport',k:'icao',cls:'tt'},{l:'Focus',k:'focus',cls:'hm'},{l:'New routes',k:'new',cls:'r'},
     {l:'Flyable with your fleet',ml:'Flyable',k:'match',cls:'r'},{l:'Fits a session',ml:'One session',k:'sim',cls:'r'},
     {l:'Cargo',k:'cargo',cls:'r'},{l:'Connects with',cls:'hm small'}],
    rows.map((c,i)=>({cells:[
      '<span class="rank">#'+(i+1)+'</span><a class="lnk" href="#buy/'+esc(c.icao)+'">'+esc(c.icao)+'</a> '
        +esc(c.name)+' <span class="tag mo-i">'+esc(c.focus)+'</span>',
      '<span class="tag">'+esc(c.focus)+'</span>',
      '<span class="big-num">'+nf(c.gain.new_pairs)+'</span>',
      '<span class="big-num m">'+nf(c.gain.match_pairs)+'</span>',
      nf(c.gain.simmable_pairs),nf(c.gain.cargo_pairs),cut(c.gain.connects,10)]})),{sort:buSort});
}

function cd(icao){
  SORTFN=null;
  const c=(D.candidates||[]).find(x=>x.icao===icao);
  if(!c){app.innerHTML='<a class="back" href="#buy">'+BACK+'Buy advice</a><div class="panel empty-state"><b>Not found</b>'
    +esc(icao)+' is not a candidate in the latest data.</div>';return;}
  const city=cityOf(c.name);
  app.innerHTML='<a class="back" href="#buy">'+BACK+'Buy advice</a>'
   +title(esc(c.icao)+' &middot; '+esc(c.name),'',
     '<span class="tag acc">'+esc(c.focus)+'</span>')
   +'<div class="stats">'+[[c.gain.new_pairs,'New routes this unlocks','acc'],
     [c.gain.match_pairs,'Of those, flyable with your fleet','ok'],
     [c.gain.simmable_pairs,'Short enough for one session'],
     [c.gain.cargo_pairs,'Flown by cargo aircraft']]
     .map(x=>'<div class="stat '+(x[2]||'')+'"><b>'+nf(x[0])+'</b><span>'+x[1]+'</span></div>').join('')+'</div>'
   +'<h2 class="sec">Why</h2><div class="panel pad">'+esc(en(c.why||'No reasoning stored.'))
   +(c.known_developers?'<p class="note">Known developers: '+esc(c.known_developers.join(' | '))+'</p>':'')+'</div>'
   +((c.gain.connects||[]).length?'<h2 class="sec">Connects with <span class="count">'+c.gain.connects.length+'</span></h2>'
     +'<div class="codes">'+c.gain.connects.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>':'')
   +(c.prices&&c.prices.length?'<h2 class="sec">Prices found</h2>'
     +table([{l:'Store',cls:'tt'},{l:'Price',cls:'r'}],c.prices.map(p=>({cells:[
       '<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.store)+'</a>',
       esc(p.price)+' '+esc(p.currency||'')]}))):'')
   +'<h2 class="sec">Search the shops by code</h2><div class="stores">'
   +Object.entries(c.price_search||{}).map(s=>'<a href="'+esc(s[1])+'" target="_blank" rel="noopener">'
     +esc(STORE[s[0]]||s[0])+'</a>').join('')+'</div>'
   +'<h2 class="sec">Search by city name</h2><div class="stores">'
   +Object.entries(TPL).map(s=>'<a href="'+s[1]+encodeURIComponent(city)+'" target="_blank" rel="noopener">'
     +esc(STORE[s[0]]||s[0])+'</a>').join('')+'</div>'
   +'<p class="note">A bare code returns noise in most shops, so the second row searches on &ldquo;'+esc(city)
   +'&rdquo; instead.</p>';
}

/* ------------------------------------------------------------ changes ---- */
const EVG={
  routes:['Routes',k=>/^(ROUTE_|PAIR_|SUSPENDED|RESUMED)/.test(k)],
  aircraft:['Aircraft',k=>/^TYPE_/.test(k)],
  fleet:['Your fleet',k=>/^(MATCH_|SIMMABLE_)/.test(k)],
  schedule:['Days and seasons',k=>/^(DOW_|SEASON_)/.test(k)],
  other:['Other',k=>!/^(ROUTE_|PAIR_|SUSPENDED|RESUMED|TYPE_|MATCH_|SIMMABLE_|DOW_|SEASON_)/.test(k)]};
let evG='all', evPage=1;
function ev(){
  SORTFN=null;
  const all=D.events;
  const cnt=g=>all.filter(e=>EVG[g][1](String(e.kind))).length;
  const groups=Object.keys(EVG).filter(g=>cnt(g));
  if(evG!=='all'&&!groups.includes(evG)) evG='all';
  app.innerHTML=title('Changes','Every change the runs have recorded, newest first. Red marks a route or pair change, '
   +'amber a change in aircraft or timing.')
   +'<div class="toolbar"><div class="chips scrollx" id="evChips"><span class="chip'+(evG==='all'?' on':'')
   +'" data-g="all">All <span class="n">'+nf(all.length)+'</span></span>'
   +groups.map(g=>'<span class="chip'+(evG===g?' on':'')+'" data-g="'+g+'">'+EVG[g][0]+' <span class="n">'
     +nf(cnt(g))+'</span></span>').join('')+'</div></div><div id="evt"></div>';
  document.getElementById('evChips').addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    evG=c.dataset.g; evPage=1;
    document.querySelectorAll('#evChips .chip').forEach(x=>x.classList.toggle('on',x===c));
    renderEV();
  });
  renderEV();
}
function renderEV(){
  const list=evG==='all'?D.events:D.events.filter(e=>EVG[evG][1](String(e.kind)));
  const shown=list.slice(0,100*evPage);
  const more=shown.length<list.length?'<button class="more-btn" id="evMore">Show more &middot; '
    +nf(shown.length)+' of '+nf(list.length)+'</button>':'';
  document.getElementById('evt').innerHTML=evTable(shown,{after:more});
  const mb=document.getElementById('evMore'); if(mb) mb.onclick=()=>{evPage++;renderEV();};
}

/* ------------------------------------------------------------ seasons ---- */
function se(){
  SORTFN=null;
  const s=D.summary, a=new Date(s.season.start), b=new Date(s.season.end), now=new Date();
  const f=Math.max(0,Math.min(1,(now-a)/(b-a)));
  const left=Math.max(0,Math.ceil((b-now)/864e5));
  const sev=D.events.filter(e=>String(e.kind).startsWith('SEASON'));
  app.innerHTML=title('Seasons','Airlines change their timetable twice a year. Summer runs from the last Sunday of March '
   +'to the day before the last Sunday of October; winter covers the rest.')
   +'<div class="season-card">'
   +'<div class="panel pad"><div class="lbl muted small">CURRENT SEASON</div><div class="val" style="font-size:26px;font-weight:750">'
   +esc(s.season.label)+'</div><div class="muted small">'+esc(s.season.start)+' &rarr; '+esc(s.season.end)+'</div>'
   +'<div class="meter"><i style="width:'+(f*100).toFixed(1)+'%;background:var(--accent)"></i></div>'
   +'<div class="small muted">'+Math.round(f*100)+'% through &middot; '+left+' day'+(left===1?'':'s')+' left</div></div>'
   +'<div class="panel pad"><div class="lbl muted small">NEXT SEASON</div><div class="val" style="font-size:26px;font-weight:750">'
   +esc(s.counter_season)+'</div><div class="muted small">Starts '+esc(new Date(b.getTime()+864e5).toISOString().slice(0,10))+', when the clocks change</div></div>'
   +'<div class="panel pad"><div class="lbl muted small">SEASON EVENTS</div><div class="val" style="font-size:26px;font-weight:750">'
   +nf(sev.length)+'</div><div class="muted small">new, returning or swapped per season</div></div>'
   +'</div>'
   +'<h2 class="sec">Season changes</h2>'+evTable(sev,{empty:'No season changes recorded yet. They appear once a route '
   +'is seen in two seasons.'})
   +'<p class="note">RouteWatch works the season out from the date, so future seasons need no configuration.</p>';
}

/* -------------------------------------------------------------- fleet ---- */
function fl(){
  SORTFN=null;
  const al=D.airlines||{}, codes=Object.keys(al).sort();
  app.innerHTML=title('Fleet','The aircraft in your hangar, and what RouteWatch counts as close enough when the real '
   +'flight uses something else.')
   +'<h2 class="sec">Aircraft you own <span class="count">'+D.fleet.owned.length+'</span></h2>'
   +table([{l:'Aircraft',cls:'tt'},{l:'Role'},{l:'Range',cls:'r num'},{l:'Counts as',cls:'small'}],
     D.fleet.owned.map(f=>({cells:[
       esc(f.name)+' <span class="sub"><code>'+esc(f.key)+'</code></span>',
       '<span class="tag'+(f.role==='cargo'?' acc':'')+'">'+esc(f.role)+'</span>',
       nf(f.range_nm)+' NM',esc([...new Set(f.types.map(prettyType))].join(', '))]})))
   +'<h2 class="sec">Close-enough substitutes</h2>'
   +table([{l:'Real aircraft',cls:'tt'},{l:'You would fly'},{l:'What you give up',cls:'full small'}],
     Object.entries(D.fleet.near_match||{}).map(x=>({cells:[
       esc(prettyType(x[0])),esc(prettyType(x[1].substitute)),esc(en(x[1].concession))]})),
     {empty:'No substitutes configured.'})
   +(codes.length?'<h2 class="sec">Airlines seen on your network <span class="count">'+codes.length+'</span></h2>'
     +'<div class="airl">'+codes.map(c=>'<div><code>'+esc(c)+'</code><span title="'+esc(al[c])+'">'+esc(al[c])
       +'</span></div>').join('')+'</div>'
     +'<p class="note">Built by each run from the names the sources return, so it never needs editing by hand.</p>':'')
   +'<p class="note">Edit fleet and airports in the <a href="editor.html">Editor</a>.</p>';
}

/* ------------------------------------------------------------- router ---- */
const VIEWS={overview:ov,routes:pr,buy:bu,changes:ev,seasons:se,fleet:fl};
const SCROLL={}; let curKey=null;
function route(){
  const h=decodeURIComponent(location.hash.replace(/^#/,''))||'overview';
  const [v,arg]=h.split('/');
  if(curKey) SCROLL[curKey]=window.scrollY;
  const key=h;
  if(v==='route'&&arg){RW.setActive('routes');pd(arg);}
  else if(v==='buy'&&arg){RW.setActive('buy');cd(arg);}
  else{const k=VIEWS[v]?v:'overview';RW.setActive(k);VIEWS[k]();}
  const prev=curKey; curKey=key;
  /* Coming back from a detail page lands where you left the list. */
  const wasDetail=prev&&prev.includes('/');
  window.scrollTo(0,wasDetail&&SCROLL[key]?SCROLL[key]:0);
}
window.addEventListener('hashchange',route);

fetch('./data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  D=d;
  APMAP=Object.fromEntries((d.airports||[]).map(a=>[a.icao,a]));
  const s=d.summary||{};
  if(!s.generated){app.innerHTML='<div class="panel empty-state"><b>No data yet</b>Open <b>Actions</b> in your '
   +'repository, pick <b>RouteWatch</b>, click <b>Run workflow</b> and set backfill_days to <code>1</code>.</div>';return;}
  RW.setMeta('<b>'+esc(s.season.label)+'</b><span title="'+esc(RW.when(s.generated))+'">&middot; '+esc(RW.ago(s.generated))
   +'</span><span class="long">&middot; '+nf(s.pairs_served)+' of '+nf(s.pairs_possible)+' pairs served</span>',s.generated);
  route();
}).catch(()=>{app.innerHTML='<div class="panel empty-state"><b>No data yet</b>Actions &rarr; RouteWatch &rarr; '
  +'Run workflow (backfill_days 1).</div>';});

</script></body></html>
