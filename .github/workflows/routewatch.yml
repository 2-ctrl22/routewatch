name: RouteWatch

on:
  # Weekly: the free AeroDataBox plan provides 600 units per month.
  # One collection round costs 82 units (41 airports x 2), so 4.33 rounds/month fit.
  schedule:
    - cron: "0 5 * * 1"          # every Monday at 05:00 UTC
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Days the COLLECTOR fetches (1 = 82 units, 2 = 164 units)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: routewatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 0. Validate the config FIRST. routewatch.mjs feeds config lat/lon straight
      #    into a Math.acos distance formula, so a null coordinate produces NaN,
      #    and `nm > range_nm` against NaN is false. The result is a leg silently
      #    reported as not simmable instead of an error. scan-sim.mjs --write
      #    intentionally proposes airports with needs_coordinates:true, so this is
      #    the guard between that proposal and a live config. Running it before the
      #    collector also means a broken config costs 0 units instead of 82.
      - name: Validate config
        env:
          ADB_UNITS_PER_CALL: '2'
          ENRICH_UNIT_CAP: '60'
        run: node scripts/check-config.mjs

      # 1. Collect: one call per airport; time window rotates each week.
      #    This step costs API units. Keep BACKFILL_DAYS at 1.
      - name: Collect flight data (budget-aware)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
          ADB_UNIT_CAP: '110'
          ADB_UNITS_PER_CALL: '2'
          ADB_SLEEP_MS: '2500'
        run: node scripts/collect-adb.mjs

      # 2. Process: BACKFILL_DAYS is deliberately different from step 1.
      #    The collector writes a day up to seven days back because of its weekly
      #    rotation. An eight-day window always finds that CSV. This costs zero
      #    units because the providers are disabled in collection.json here and
      #    RouteWatch only reads files from disk.
      - name: Run RouteWatch
        env:
          OPENSKY_USER: ${{ secrets.OPENSKY_USER }}
          OPENSKY_PASS: ${{ secrets.OPENSKY_PASS }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ROUTEWATCH_WEBHOOK: ${{ secrets.ROUTEWATCH_WEBHOOK }}
          BACKFILL_DAYS: '8'
        run: node scripts/routewatch.mjs

      # 3. Build the shareable variants and report on retention.
      #
      #    Previously this ran with --audit, which reports but skips writing, so
      #    docs/community.json was never produced. Variant A is the aggregate-only
      #    Derived Work that Article 5.6 exempts from the distribution ban, so it
      #    is the one file we actually want served. Building it is the point.
      #
      #    Deliberately NOT passed:
      #      --sweep   would delete expired CSVs; the alpha still needs its ledger
      #                and the retention migration is not designed yet.
      #      --audit   would skip writing the variants entirely.
      #
      #    IMMERSION_DIR is left at its default of data/, so variant B with flight
      #    numbers and departure times stays out of docs/ and out of git. Do not
      #    set IMMERSION_DIR=docs until the permission is on paper.
      #
      #    pipefail keeps a script failure visible instead of being masked by tee.
      - name: Build shareable variants and audit retention
        run: |
          set -o pipefail
          mkdir -p data
          {
            echo "### Retention audit"
            echo ""
            echo '```'
          } > data/retention-check.md
          node scripts/publish-derived.mjs | tee -a data/retention-check.md
          echo '```' >> data/retention-check.md

      # 4. Enrich: reads the ledger that step 2 just wrote, so it must run after
      #    RouteWatch. run-enrich.mjs is a thin wrapper that executes
      #    enrich-adb.mjs unchanged and only translates its log output to English.
      #    Quota handling, 429 backoff and the priority rotation live in
      #    enrich-adb.mjs and are untouched.
      - name: Enrich airports, aircraft and flight types
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ENRICH_UNIT_CAP: '60'
          ENRICH_FLIGHTS: '25'
          ENRICH_RUNWAYS: 'true'
        run: node scripts/run-enrich.mjs

      - name: Commit generated data
        run: |
          git config user.name  "routewatch-bot"
          git config user.email "routewatch-bot@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "RouteWatch $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          cat data/last-run.md >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          cat data/last-enrich.md >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          cat data/retention-check.md >> $GITHUB_STEP_SUMMARY || true
