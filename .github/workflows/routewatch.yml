name: RouteWatch

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: 
    inputs:
      backfill_days:
        description: "Aantal dagen terug ophalen (eenmalig, bv. 14)"
        required: false
        default: "1"
    schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: write

concurrency:
  group: routewatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Data ophalen (budgetbewust)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
          ADB_UNIT_CAP: '110'
          ADB_UNITS_PER_CALL: '2'
        run: node scripts/collect-adb.mjs

      - name: Verrijken (banen, toestellen, types)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ENRICH_UNIT_CAP: '60'
        run: node scripts/enrich-adb.mjs
          git config user.name  "routewatch-bot"
          git config user.email "routewatch-bot@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "geen wijzigingen"
          else
            git commit -m "RouteWatch $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Samenvatting
        if: always()
        run: cat data/last-run.md >> $GITHUB_STEP_SUMMARY || true
