name: RouteWatch

on:
  # Wekelijks, want het gratis AeroDataBox-plan geeft 600 units per maand.
  # Een ronde kost 82 units (41 velden x 2), dus 4,33 rondes per maand past.
  schedule:
    - cron: "0 5 * * 1"          # elke maandag 05:00 UTC
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Aantal dagen dat de COLLECTOR ophaalt (1 = 82 units, 2 = 164 units)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: routewatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1. Ophalen: 1 aanroep per luchthaven, venster roteert per week.
      #    Let op: deze stap kost units. Houd BACKFILL_DAYS op 1.
      - name: Data ophalen (budgetbewust)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
          ADB_UNIT_CAP: '110'
          ADB_UNITS_PER_CALL: '2'
          ADB_SLEEP_MS: '2500'
        run: node scripts/collect-adb.mjs

      # 2. Verwerken: BACKFILL_DAYS staat hier op 8 en dat is BEWUST anders dan
      #    bij stap 1. De collector schrijft door de weekrotatie een dag die tot
      #    zeven dagen terug kan liggen; met een venster van 8 dagen vindt
      #    RouteWatch die CSV altijd. Dit kost NUL extra units, want deze stap
      #    leest alleen bestanden van schijf: opensky en aerodatabox staan uit
      #    in config/collection.json.
      - name: RouteWatch draaien
        env:
          OPENSKY_USER: ${{ secrets.OPENSKY_USER }}
          OPENSKY_PASS: ${{ secrets.OPENSKY_PASS }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ROUTEWATCH_WEBHOOK: ${{ secrets.ROUTEWATCH_WEBHOOK }}
          BACKFILL_DAYS: '8'
        run: node scripts/routewatch.mjs

      # 3. Verrijken: leest de ledger die stap 2 net heeft geschreven, dus
      #    deze stap moet NA RouteWatch komen.
      - name: Verrijken (banen, toestellen, types)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ENRICH_UNIT_CAP: '60'
          ENRICH_FLIGHTS: '25'
          ENRICH_RUNWAYS: 'true'
        run: node scripts/enrich-adb.mjs

      - name: Data terugcommitten
        run: |
          git config user.name  "routewatch-bot"
          git config user.email "routewatch-bot@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "geen wijzigingen"
          else
            git commit -m "RouteWatch $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Samenvatting
        if: always()
        run: |
          cat data/last-run.md >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          cat data/last-enrich.md >> $GITHUB_STEP_SUMMARY || true
