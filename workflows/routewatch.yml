name: .github/workflows/routewatch.yml

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Aantal dagen terug ophalen (eenmalig, bv. 14)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: routewatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: RouteWatch draaien
        env:
          OPENSKY_USER: ${{ secrets.OPENSKY_USER }}
          OPENSKY_PASS: ${{ secrets.OPENSKY_PASS }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ROUTEWATCH_WEBHOOK: ${{ secrets.ROUTEWATCH_WEBHOOK }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '1' }}
        run: node scripts/routewatch.mjs
      - name: Data terugcommitten
        run: |
          git config user.name  "routewatch-bot"
          git config user.email "routewatch-bot@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "geen wijzigingen"
          else
            git commit -m "RouteWatch $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Samenvatting
        if: always()
        run: cat data/last-run.md >> $GITHUB_STEP_SUMMARY || true
